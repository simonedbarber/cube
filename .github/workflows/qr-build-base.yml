# QueryRails: build the custom cube base image and publish it to GHCR.
#
# Builds packages/cubejs-docker/qr-base.Dockerfile (native addon compiled from this
# fork's Rust source + the changed JS package dist, overlaid onto the official cube
# image) on amd64 runners — no emulation — and pushes to GitHub Container Registry.
# query_rails apps/cube/Dockerfile then FROMs the published image.
name: QR Build Cube Base

on:
  workflow_dispatch:
    inputs:
      cube_version:
        description: 'Base cube version (FROM cubejs/cube:<version>-jdk)'
        type: string
        default: v1.6.64
  pull_request:
    branches:
      - master
    paths:
      - 'packages/cubejs-docker/qr-base.Dockerfile'
      - '.github/workflows/qr-build-base.yml'
  push:
    branches:
      - master
    paths:
      - 'packages/cubejs-docker/qr-base.Dockerfile'
      - '.github/workflows/qr-build-base.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/simonedbarber/cube

jobs:
  build:
    name: Build + push custom cube base
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Resolve cube version
        id: ver
        env:
          IN: ${{ inputs.cube_version }}
        run: echo "v=${IN:-v1.6.64}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The repo's default .dockerignore excludes the rust/ source tree (the official
      # image downloads a prebuilt native addon). This build compiles the native from
      # source, so swap in a permissive ignore (ephemeral checkout only) that keeps
      # rust/ + packages/ source while dropping node_modules / target / dist / .git.
      - name: Prepare build context (include rust source)
        run: |
          cat > .dockerignore <<'IGNORE'
          .git
          **/node_modules
          **/target
          **/dist
          **/coverage
          packages/cubejs-backend-native/index.node
          packages/cubejs-backend-native/native/index.node
          packages/cubejs-server-core/playground
          IGNORE

      # Tagging:
      #   :latest            — stable, version-INDEPENDENT; published ONLY on master
      #                        merges. Pin query_rails apps/cube/Dockerfile to this so
      #                        the FROM never changes across cube version bumps.
      #   :<version>         — newest build for that cube version (e.g. v1.6.64).
      #   :<version>-<sha>   — immutable pin to one build.
      - name: Compute image tags
        id: tags
        env:
          IMG: ${{ env.IMAGE }}
          VER: ${{ steps.ver.outputs.v }}
          SHA: ${{ github.sha }}
          IS_MASTER: ${{ github.ref == 'refs/heads/master' }}
        run: |
          {
            echo "list<<TAGS"
            echo "${IMG}:${VER}-${SHA}"
            echo "${IMG}:${VER}"
            [ "$IS_MASTER" = "true" ] && echo "${IMG}:latest"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cubejs-docker/qr-base.Dockerfile
          platforms: linux/amd64
          # Validate only on PRs; publish on merge to master / manual dispatch.
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            CUBE_VERSION=${{ steps.ver.outputs.v }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMG: ${{ env.IMAGE }}
          VER: ${{ steps.ver.outputs.v }}
          SHA: ${{ github.sha }}
          IS_MASTER: ${{ github.ref == 'refs/heads/master' }}
          PUSHED: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            if [ "$PUSHED" = "true" ]; then echo "### Custom cube base published"; else echo "### Custom cube base built (PR — not pushed)"; fi
            echo "- \`${IMG}:${VER}-${SHA}\` (immutable pin)"
            echo "- \`${IMG}:${VER}\` (version)"
            [ "$IS_MASTER" = "true" ] && echo "- \`${IMG}:latest\` (stable — pin apps/cube/Dockerfile FROM here)"
            echo ""
            echo "query_rails apps/cube/Dockerfile: FROM ${IMG}:latest"
          } >> "$GITHUB_STEP_SUMMARY"

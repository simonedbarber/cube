# QueryRails: build the custom cube base once, then PROMOTE (re-tag) to :latest on
# master — no rebuild on merge.
#
#   build job   — compiles qr-base.Dockerfile (native from Rust source + JS dist
#                 overlaid on the official cube image) and pushes an IMMUTABLE
#                 :<version>-<sha> tag. Runs on branch push / PR (validation) /
#                 dispatch. NOT on master push.
#   promote job — on push to master, re-tags the already-built :<version>-<sha>
#                 image to the stable, version-independent :latest (+ :<version>)
#                 via `docker buildx imagetools create`. No rebuild.
#
# query_rails apps/cube/Dockerfile pins `FROM ghcr.io/simonedbarber/cube:latest`,
# which only moves when a built branch is merged/fast-forwarded to master.
name: QR Build Cube Base

on:
  workflow_dispatch:
    inputs:
      cube_version:
        description: 'Base cube version (FROM cubejs/cube:<version>-jdk)'
        type: string
        default: v1.6.64
  pull_request:
    branches: [master]
    paths:
      - 'packages/cubejs-docker/qr-base.Dockerfile'
      - '.github/workflows/qr-build-base.yml'
  push:
    branches:
      - master
      - feat/2arg-agg-pushdown
    paths:
      - 'packages/cubejs-docker/qr-base.Dockerfile'
      - '.github/workflows/qr-build-base.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/simonedbarber/cube

jobs:
  build:
    # Build the immutable artifact (validate on PR/branch/dispatch). NOT on a master
    # push — master only promotes the already-built image (see the promote job).
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    name: Build + push artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Resolve cube version
        id: ver
        env:
          IN: ${{ inputs.cube_version }}
        run: echo "v=${IN:-v1.6.64}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The repo's default .dockerignore excludes the rust/ source (the official image
      # downloads a prebuilt native). This build compiles from source, so swap in a
      # permissive ignore (ephemeral checkout only).
      - name: Prepare build context (include rust source)
        run: |
          cat > .dockerignore <<'IGNORE'
          .git
          **/node_modules
          **/target
          **/dist
          **/coverage
          packages/cubejs-backend-native/index.node
          packages/cubejs-backend-native/native/index.node
          packages/cubejs-server-core/playground
          IGNORE

      - name: Build + push immutable artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/cubejs-docker/qr-base.Dockerfile
          platforms: linux/amd64
          # Validate only on PRs; push the immutable artifact on branch push / dispatch.
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            CUBE_VERSION=${{ steps.ver.outputs.v }}
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.v }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    # On merge / fast-forward to master: re-tag the already-built artifact to the
    # stable :latest (+ :<version>). NO rebuild — pure registry manifest copy.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    name: Promote to :latest (re-tag, no rebuild)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need HEAD^2 to detect a merge commit's source

      - name: Resolve cube version
        id: ver
        env:
          IN: ${{ inputs.cube_version }}
        run: echo "v=${IN:-v1.6.64}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag merged artifact as :latest
        env:
          IMG: ${{ env.IMAGE }}
          VER: ${{ steps.ver.outputs.v }}
          SHA: ${{ github.sha }}
        run: |
          # The merged content was built on the branch as ${IMG}:${VER}-<branch-sha>.
          # Fast-forward update → branch sha == ${SHA}. Merge commit → its 2nd parent.
          SRC="${SHA}"
          if git rev-parse -q --verify "HEAD^2" >/dev/null; then SRC="$(git rev-parse HEAD^2)"; fi
          echo "Promoting ${IMG}:${VER}-${SRC} -> :latest + :${VER}"
          docker buildx imagetools create \
            -t "${IMG}:latest" \
            -t "${IMG}:${VER}" \
            "${IMG}:${VER}-${SRC}"
          {
            echo "### Promoted to :latest (no rebuild)"
            echo "- source: \`${IMG}:${VER}-${SRC}\`"
            echo "- \`${IMG}:latest\`, \`${IMG}:${VER}\`"
          } >> "$GITHUB_STEP_SUMMARY"
